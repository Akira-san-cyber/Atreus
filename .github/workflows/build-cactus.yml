name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone, Setup, and Build Cactus
        run: |
          # Clone the repository
          git clone https://github.com/cactus-compute/cactus.git
          cd cactus
          
          # Verify the android directory exists before building
          ls -la android/ || { echo "ERROR: android directory is missing!"; exit 1; }
          
          # Setup the environment (installs the CLI)
          source ./setup
          
          # Build using the official command
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          cactus build --android

      - name: Upload Cactus .so Library
        uses: actions/upload-artifact@v4
        with:
          name: cactus-native-lib
          # The output is libcactus_engine.so based on official docs
          path: cactus/android/libcactus_engine.so
