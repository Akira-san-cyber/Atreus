name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone, Setup, and Build Cactus
        run: |
          # 1. Clone the repository
          git clone https://github.com/cactus-compute/cactus.git
          cd cactus
          
          # 2. Run the official setup script (creates the .venv)
          source ./setup
          
          # 3. Set the NDK path and run the official build command
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          echo "--- Building Cactus for Android ---"
          cactus build --android
          
          # 4. Locate the generated .so file
          echo "--- Finding generated .so files ---"
          find . -name "*.so" -type f

      - name: Upload Cactus Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cactus-android-lib
          # Upload the compiled engine AND the Kotlin wrapper files
          path: |
            cactus/**/*.so
            cactus/**/Cactus.kt
# Official Android build
