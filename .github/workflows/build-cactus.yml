name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone and Build Cactus for Android
        run: |
          # 1. Clone the repository
          git clone https://github.com/cactus-compute/cactus
          cd cactus

          # 2. Setup the environment
          source ./setup

          # 3. Diagnostic: Locate the Android build script
          echo "--- Top-level folders ---"
          ls -d */

          echo "--- Searching for Android build script ---"
          SCRIPT=$(find . -name "*.sh" -not -path "./.git/*" | grep -i android | grep -i build | head -1 || true)
          
          if [ -z "$SCRIPT" ]; then
            echo "❌ ERROR: No Android build script found in the repository."
            exit 1
          fi
          
          echo "✅ Found build script at: $SCRIPT"

          # 4. Execute the build script directly
          echo "--- Starting C++ Compilation ---"
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          bash "$SCRIPT"

          # 5. Locate the generated .so file
          echo "--- Searching for compiled .so files ---"
          find . -name "libcactus*" -type f

      - name: Upload Cactus .so Library
        uses: actions/upload-artifact@v4
        with:
          name: cactus-native-lib
          # Use wildcards to grab the .so file no matter its exact name or location
          path: cactus/**/libcactus*.so
