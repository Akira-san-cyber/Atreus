name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone, Setup, and Build Cactus
        run: |
          # 1. Clone and checkout the stable version
          git clone https://github.com/cactus-compute/cactus.git
          cd cactus
          git checkout v2.0.1
          
          # 2. Run setup (creates the virtual environment)
          source ./setup
          
          # 3. Activate the environment (handles both 'venv' and '.venv')
          if [ -f "venv/bin/activate" ]; then
            source venv/bin/activate
          elif [ -f ".venv/bin/activate" ]; then
            source .venv/bin/activate
          fi

          # 4. Set NDK path and run the official build command
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          echo "--- Building Cactus for Android ---"
          cactus build --android

          # 5. Verify the output
          find . -name "libcactus*" -type f
          find . -name "Cactus*.kt" -type f

      - name: Upload Cactus Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cactus-android-lib
          path: |
            cactus/android/libcactus_engine.so
            cactus/**/Cactus.kt
            cactus/**/CactusCallbacks.kt
