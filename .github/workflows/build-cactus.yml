name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone, Checkout Release, and Build Cactus
        run: |
          # 1. Clone the repository
          git clone https://github.com/cactus-compute/cactus.git
          cd cactus

          # 2. Fetch tags and checkout the latest stable release
          git fetch --tags
          echo "--- Checking out v1.14 ---"
          git checkout v1.14

          # 3. Verify the android directory exists (it should now)
          echo "--- Verifying android/ directory ---"
          ls -la android/

          # 4. Setup environment and build
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          source ./setup
          echo "--- Building Cactus for Android ---"
          cactus build --android

      - name: Upload Cactus .so Library
        uses: actions/upload-artifact@v4
        with:
          name: cactus-native-lib
          # The output is libcactus.so (based on official docs)
          path: cactus/android/libcactus.so
