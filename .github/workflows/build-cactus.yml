name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone, Verify, and Build Cactus
        run: |
          # 1. Clone the repository
          git clone https://github.com/cactus-compute/cactus.git
          cd cactus
          
          # 2. Set the NDK path
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          
          # 3. Verify the build script exists in the android subfolder
          echo "--- Verifying android/build.sh ---"
          if [ ! -f "android/build.sh" ]; then
            echo "❌ ERROR: android/build.sh not found! The repository structure has changed."
            exit 1
          fi
          
          # 4. Execute the official build script
          echo "--- Building Cactus Engine ---"
          bash android/build.sh

          # 5. Verify the compiled library
          echo "--- Finding generated .so files ---"
          find . -name "libcactus_engine.so" -type f

      - name: Upload Cactus Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cactus-android-lib
          # Upload the .so and the Kotlin wrapper files
          path: |
            cactus/android/libcactus_engine.so
            cactus/**/Cactus.kt
            cactus/**/CactusCallbacks.kt
# Android build fix
