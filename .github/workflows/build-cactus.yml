name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone and Build with CMake
        run: |
          # 1. Clone the repository
          git clone --recursive https://github.com/cactus-compute/cactus.git
          cd cactus

          # 2. Point CMake to the 'android' directory (where CMakeLists.txt lives)
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          
          echo "--- Starting CMake Configuration ---"
          cmake -B build-android -S android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

          echo "--- Starting Compilation ---"
          cmake --build build-android --config Release --parallel

      - name: Upload Cactus .so Library
        uses: actions/upload-artifact@v4
        with:
          name: cactus-native-lib
          # The output should be libcactus_engine.so
          path: cactus/build-android/**/*.so
