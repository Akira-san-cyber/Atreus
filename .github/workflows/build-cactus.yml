name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone, Verify, and Build Cactus
        run: |
          # 1. Clone the repository from the main branch
          git clone --recursive https://github.com/cactus-compute/cactus.git
          cd cactus
          
          # 2. Verify the build script exists
          echo "--- Verifying android/build.sh ---"
          ls -la android/build.sh
          
          # 3. Set the NDK environment variable
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          
          # 4. Run the official Android build script directly
          echo "--- Building C++ Engine ---"
          bash android/build.sh

      - name: Upload Cactus .so Library
        uses: actions/upload-artifact@v4
        with:
          name: cactus-native-lib
          # The output is generated as libcactus.so inside the android folder
          path: cactus/android/*.so
