name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone, Checkout v2.0.1, and Build Cactus
        run: |
          # 1. Clone the repository
          git clone https://github.com/cactus-compute/cactus.git
          cd cactus
          
          # 2. Checkout the working release
          git checkout v2.0.1
          
          # 3. Setup the environment and build
          source ./setup
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          echo "--- Building Cactus for Android ---"
          cactus build --android

      - name: Locate Output Files
        run: |
          cd cactus
          echo "--- Generated .so file ---"
          ls -la android/libcactus_engine.so
          echo "--- Kotlin wrapper files ---"
          find . -name "Cactus*.kt" -type f

      - name: Upload Cactus Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cactus-android-lib
          # This grabs the compiled library AND the required Kotlin files
          path: |
            cactus/android/libcactus_engine.so
            cactus/**/Cactus.kt
            cactus/**/CactusCallbacks.kt
