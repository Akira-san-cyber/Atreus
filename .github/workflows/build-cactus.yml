name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone, Find Script, and Build Cactus
        run: |
          # 1. Clone the repository
          git clone https://github.com/cactus-compute/cactus.git
          cd cactus
          
          # 2. Set the NDK path as required by the Cactus build system
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          
          # 3. The official build script is located inside the android/ directory
          echo "--- Running the official android/build.sh ---"
          bash android/build.sh
          
          # 4. Verify the compiled .so file exists
          echo "--- Finding the generated .so file ---"
          find . -name "libcactus_engine.so" -type f

      - name: Upload Cactus Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cactus-android-lib
          # Upload the compiled engine AND the required Kotlin wrapper files
          path: |
            cactus/android/libcactus_engine.so
            cactus/**/Cactus.kt
            cactus/**/CactusCallbacks.kt
# CMake build update
