name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone and Inspect Repository
        run: |
          git clone --recursive https://github.com/cactus-compute/cactus.git
          cd cactus
          echo "--- Root directory contents ---"
          ls -la
          echo "--- Searching for build.sh ---"
          find . -name "build.sh" -type f
          echo "--- Searching for Android CMakeLists.txt ---"
          find . -name "CMakeLists.txt" -type f | grep -i android || true

      - name: Build Cactus (Auto-detect script)
        run: |
          cd cactus
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          
          if [ -f "android/build.sh" ]; then
            echo "Found android/build.sh, building..."
            bash android/build.sh
          elif [ -f "cactus-engine/build.sh" ]; then
            echo "Found cactus-engine/build.sh, building..."
            bash cactus-engine/build.sh
          elif [ -f "scripts/android/build.sh" ]; then
            echo "Found scripts/android/build.sh, building..."
            bash scripts/android/build.sh
          else
            echo "ERROR: Could not find any Android build script. Please check the repository structure."
            exit 1
          fi

      - name: Upload Cactus .so Library
        uses: actions/upload-artifact@v4
        with:
          name: cactus-native-lib
          path: cactus/**/libcactus_engine.so
