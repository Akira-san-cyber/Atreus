name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone, Find CMake, and Build Cactus
        run: |
          # 1. Clone and checkout the working version
          git clone https://github.com/cactus-compute/cactus.git
          cd cactus
          git checkout v2.0.1
          
          # 2. Find the exact folder where CMakeLists.txt is located
          CMAKE_DIR=$(find . -name "CMakeLists.txt" -not -path "./.git/*" | head -1 | xargs dirname)
          echo "✅ Found CMakeLists.txt in: $CMAKE_DIR"
          
          # 3. Set NDK path and build directly with CMake
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          
          echo "--- Starting CMake Configuration ---"
          cmake -B build-android -S "$CMAKE_DIR" \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
            
          echo "--- Starting Compilation ---"
          cmake --build build-android --config Release --parallel
          
          # 4. Verify the .so file was created
          echo "--- Verifying compiled library ---"
          find . -name "*.so" -type f

      - name: Upload Cactus Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cactus-android-lib
          path: |
            cactus/**/*.so
            cactus/**/Cactus.kt
            cactus/**/CactusCallbacks.kt
