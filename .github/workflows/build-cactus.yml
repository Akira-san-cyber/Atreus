name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone and Build Cactus for Android
        run: |
          # 1. Clone the repo
          git clone https://github.com/cactus-compute/cactus.git
          cd cactus
          
          # 2. Checkout the stable version (v2.0.1) to ensure the script exists
          git checkout v2.0.1
          
          # 3. Setup environment
          source ./setup
          
          # 4. Set NDK path and run the build script directly
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          echo "--- Listing android directory ---"
          ls android/
          
          echo "--- Starting Compilation ---"
          bash android/build.sh
          
          # 5. Find the generated .so file
          echo "--- Finding generated files ---"
          find . -name "libcactus*" -type f

      - name: Upload Cactus .so Library
        uses: actions/upload-artifact@v4
        with:
          name: cactus-android-lib
          # Use wildcards to catch the .so file wherever the build puts it
          path: cactus/**/libcactus*.so
