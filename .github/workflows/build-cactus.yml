name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone Cactus
        run: |
          # A full clone (no --depth) ensures all submodules and scripts are present
          git clone https://github.com/cactus-compute/cactus.git

      - name: Build Cactus via Official Android Script
        run: |
          cd cactus
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          # This is the official build command for Android
          bash android/build.sh

      - name: Upload Cactus .so Library
        uses: actions/upload-artifact@v4
        with:
          name: cactus-native-lib
          # The official README states the output is libcactus_engine.so
          path: cactus/android/libcactus_engine.so
