name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone and Build Cactus Engine
        run: |
          # 1. Clone the repository (using main branch)
          git clone --depth 1 https://github.com/cactus-compute/cactus.git
          cd cactus

          # 2. Setup the environment
          source ./setup

          # 3. Build the engine for Android
          # This command creates the 'android/' folder and compiles the .so file
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          cactus build --android

          # 4. Verify the output was created
          ls -la android/

      - name: Upload Cactus .so Library
        uses: actions/upload-artifact@v4
        with:
          name: cactus-native-lib
          # The build outputs libcactus.so inside the generated android/ folder
          path: cactus/android/libcactus.so
