name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone and Build Cactus
        run: |
          # 1. Clone the repository (--depth 1 is faster and more reliable for CI)
          git clone --depth 1 https://github.com/cactus-compute/cactus.git
          cd cactus
          
          # 2. Go directly into the android folder
          cd android
          
          # 3. Set the NDK path and run the official build script
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          bash build.sh
          
          # 4. Copy the compiled .so file to Atreus's jniLibs folder
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          cp libcactus_engine.so ../../app/src/main/jniLibs/arm64-v8a/

      - name: Upload Cactus .so Library
        uses: actions/upload-artifact@v4
        with:
          name: cactus-native-lib
          # This will grab the .so file from Atreus's jniLibs folder
          path: app/src/main/jniLibs/arm64-v8a/libcactus_engine.so
