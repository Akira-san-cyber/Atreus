name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone, Setup, and Build Cactus
        run: |
          git clone https://github.com/cactus-compute/cactus.git
          cd cactus
          
          # Run the setup script to create the environment
          source ./setup
          
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          
          echo "--- Checking where cactus is installed ---"
          ls -la .venv/bin/ | grep cactus || true
          
          echo "--- Running build via explicit venv path ---"
          # Use the exact path to the executable
          ./.venv/bin/cactus build --android
          
          echo "--- Finding generated .so files ---"
          find . -name "*.so" -type f

      - name: Upload Cactus Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cactus-android-lib
          path: |
            cactus/**/*.so
            cactus/**/Cactus.kt
# Final CI fix
