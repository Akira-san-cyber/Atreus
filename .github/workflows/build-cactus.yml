name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Atreus Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone, Setup, and Build Cactus
        run: |
          # 1. Clone the repository
          git clone https://github.com/cactus-compute/cactus.git
          
          # 2. Enter the cloned directory
          cd cactus
          
          # 3. Setup the environment (installs the cactus CLI tool)
          source ./setup
          
          # 4. Build using the official command
          echo "--- Building Cactus for Android ---"
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          cactus build --android

      - name: Upload Cactus .so Library
        uses: actions/upload-artifact@v4
        with:
          name: cactus-native-lib
          # The official build output is android/libcactus_engine.so
          path: cactus/android/libcactus_engine.so
