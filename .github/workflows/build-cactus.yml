name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone, Checkout v1.7, Verify and Build
        run: |
          # 1. Clone the repository
          git clone https://github.com/cactus-compute/cactus.git
          cd cactus
          
          # 2. Checkout the official version that contains the Android build script
          git checkout v1.7
          
          # 3. Verify the build script exists
          echo "--- Verifying android/build.sh ---"
          ls -la android/build.sh
          
          # 4. Setup environment and build
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          source ./setup
          echo "--- Building C++ Engine ---"
          cactus build --android

      - name: Upload Cactus .so Library
        uses: actions/upload-artifact@v4
        with:
          name: cactus-native-lib
          # Use a wildcard to catch the .so file regardless of exact naming
          path: cactus/android/**/*.so
