name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone, Verify, and Build Cactus
        run: |
          # Recursively clone to ensure all submodules are downloaded
          git clone --recursive https://github.com/cactus-compute/cactus.git
          cd cactus
          
          # Set the NDK environment variable
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          
          # Verify the build script exists before running
          echo "--- Verifying android/build.sh ---"
          ls -la android/build.sh
          
          # Run the official Android compilation script
          echo "--- Building C++ Engine ---"
          bash android/build.sh

      - name: Upload Cactus .so Library
        uses: actions/upload-artifact@v4
        with:
          name: cactus-native-lib
          # Use a wildcard (**) to find the .so file wherever the script outputs it
          path: cactus/**/*.so
