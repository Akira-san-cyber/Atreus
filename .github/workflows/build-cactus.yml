name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone, Search, and Build Cactus
        run: |
          # 1. Clone the repository
          git clone --recursive https://github.com/cactus-compute/cactus.git
          cd cactus
          
          # 2. Search for the build script
          echo "--- Searching for build.sh ---"
          BUILD_DIR=$(find . -type f -name "build.sh" | head -1 | xargs dirname)
          
          if [ -z "$BUILD_DIR" ]; then
            echo "ERROR: Could not find build.sh anywhere in the repository!"
            exit 1
          fi
          
          # 3. Navigate to the folder where the script was found
          echo "--- Found build.sh in: $BUILD_DIR. Navigating there... ---"
          cd "$BUILD_DIR"
          
          # 4. Set NDK path and execute the build
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          echo "--- Starting C++ Compilation ---"
          bash build.sh

      - name: Upload Cactus .so Library
        uses: actions/upload-artifact@v4
        with:
          name: cactus-native-lib
          # Finds any .so file generated anywhere in the cactus folder
          path: cactus/**/*.so
