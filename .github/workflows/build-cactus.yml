name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone Cactus
        run: |
          git clone https://github.com/cactus-compute/cactus.git
          cd cactus

      - name: Build C++ Engine with CMake
        run: |
          cd cactus
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          
          # Configure the build for Android ARM64
          cmake -B build-android -S . \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
            
          # Compile the engine
          cmake --build build-android --config Release --parallel

      - name: Find and Upload Cactus .so Library
        run: |
          cd cactus
          echo "--- Searching for the compiled .so file ---"
          find . -name "*.so" -type f
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cactus-native-lib
          path: cactus/build-android/**/*.so
