name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone, Find CLI, and Build Cactus
        run: |
          # 1. Clone and checkout the working version
          git clone https://github.com/cactus-compute/cactus.git
          cd cactus
          git checkout v2.0.1
          
          # 2. Run setup to install dependencies
          source ./setup
          
          # 3. Automatically find the 'cactus' executable file
          echo "--- Searching for Cactus CLI executable ---"
          CLI_PATH=$(find . -type f -name "cactus" | head -n 1)
          
          if [ -z "$CLI_PATH" ]; then
            echo "❌ ERROR: Could not find the 'cactus' executable anywhere!"
            exit 1
          fi
          
          echo "✅ Found Cactus CLI at: $CLI_PATH"
          chmod +x "$CLI_PATH"

          # 4. Set NDK path and build
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          echo "--- Building Cactus for Android ---"
          "$CLI_PATH" build --android

          # 5. Find the generated files
          echo "--- Finding generated .so files ---"
          find . -name "libcactus*.so" -type f

      - name: Upload Cactus Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cactus-android-lib
          path: |
            cactus/**/libcactus*.so
            cactus/**/Cactus.kt
            cactus/**/CactusCallbacks.kt
