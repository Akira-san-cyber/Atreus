name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone and Build Cactus Engine Directly
        run: |
          # 1. Clone the repository (using the main branch)
          git clone --depth 1 https://github.com/cactus-compute/cactus.git
          cd cactus

          # 2. Setup the environment (installs Python deps, etc.)
          source ./setup

          # 3. Set the NDK path and run the build script directly
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          echo "--- Running android/build.sh directly ---"
          bash android/build.sh

          # 4. Verify the output was created
          echo "--- Verifying output ---"
          ls -la android/build/lib/

      - name: Upload Cactus .so Library
        uses: actions/upload-artifact@v4
        with:
          name: cactus-native-lib
          # The build script outputs to android/build/lib/libcactus.so
          path: cactus/android/build/lib/libcactus.so
