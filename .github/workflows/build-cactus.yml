name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone and Build Cactus Engine
        run: |
          # 1. Recursively clone the repository to ensure all submodules are present
          git clone --recursive https://github.com/cactus-compute/cactus.git
          cd cactus

          # 2. Set the NDK environment variable
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125

          # 3. Navigate directly to the android directory and run the official build script
          echo "--- Navigating to android directory and building ---"
          cd android
          bash build.sh

      - name: Upload Cactus .so Library
        uses: actions/upload-artifact@v4
        with:
          name: cactus-native-lib
          # The output from the build script is libcactus_engine.so
          path: cactus/android/libcactus_engine.so
