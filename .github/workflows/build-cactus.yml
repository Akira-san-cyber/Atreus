name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone, Verify, and Build Cactus
        run: |
          # Recursively clone to fetch submodules
          git clone --recursive https://github.com/cactus-compute/cactus.git
          
          # Move into the cloned directory
          cd cactus
          
          # List contents to verify the android folder exists before building
          echo "--- Verifying android/ directory ---"
          ls -la android/
          
          # Set the environment variable for NDK
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          
          # Execute the official build script
          bash android/build.sh

      - name: Upload Cactus .so Library
        uses: actions/upload-artifact@v4
        with:
          name: cactus-native-lib
          # The correct output path based on official documentation
          path: cactus/android/libcactus_engine.so
