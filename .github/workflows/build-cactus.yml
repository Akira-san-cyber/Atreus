name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone and Build Cactus Engine
        run: |
          # 1. Clone the main branch (no special tag needed)
          git clone https://github.com/cactus-compute/cactus.git
          cd cactus
          
          # 2. Setup the environment (installs the CLI tool)
          source ./setup
          
          # 3. Set NDK path and build using the official command
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          echo "--- Starting C++ Compilation ---"
          cactus build --android
          
          # 4. Locate the generated .so file (it might be libcactus.so or libcactus_engine.so)
          echo "--- Searching for compiled .so files ---"
          find . -name "*.so" -type f

      - name: Upload Cactus .so Library
        uses: actions/upload-artifact@v4
        with:
          name: cactus-native-lib
          # Use wildcards to catch the .so file wherever it was generated
          path: cactus/**/*.so
