name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone and inspect Cactus repo
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/cactus-compute/cactus.git cactus
          cd cactus
          
          echo "--- repo root ---"
          pwd
          echo "--- files to inspect ---"
          find . -maxdepth 4 \( -name "CMakeLists.txt" -o -path "*/android/*" -o -name "build.sh" \) -type f

      - name: Build Cactus
        run: |
          set -euxo pipefail
          cd cactus
          
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          
          CMAKE_FILE=$(find . -name "CMakeLists.txt" -type f | head -n 1 || true)
          if [ -z "$CMAKE_FILE" ]; then
            echo "ERROR: No CMakeLists.txt found in cloned cactus repo"
            echo "Likely wrong repo, wrong branch, or upstream layout changed"
            exit 1
          fi
          
          CMAKE_DIR=$(dirname "$CMAKE_FILE")
          echo "Using CMake project at: $CMAKE_DIR"
          
          cmake -S "$CMAKE_DIR" -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
            
          cmake --build build-android --config Release --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cactus-android-lib
          path: |
            cactus/**/*.so
# Dynamic path finding
