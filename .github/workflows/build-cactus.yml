name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone and Build Cactus Directly with CMake
        run: |
          # 1. Clone the repository and pin the working version
          git clone https://github.com/cactus-compute/cactus.git
          cd cactus
          git checkout v2.0.1
          
          # 2. Find the CMakeLists.txt file
          echo "--- Searching for CMakeLists.txt ---"
          CMAKE_FILE=$(find . -name "CMakeLists.txt" -type f | grep -v ".git" | head -n 1)
          
          if [ -z "$CMAKE_FILE" ]; then
            echo "❌ ERROR: CMakeLists.txt not found!"
            exit 1
          fi
          
          CMAKE_DIR=$(dirname "$CMAKE_FILE")
          echo "✅ Found CMakeLists.txt in: $CMAKE_DIR"
          
          # 3. Set NDK path
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          
          # 4. Run CMake directly to configure the build
          echo "--- Configuring CMake ---"
          cmake -B build-android -S "$CMAKE_DIR" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
            
          # 5. Compile the C++ code
          echo "--- Compiling C++ Engine ---"
          cmake --build build-android --config Release --parallel
          
          # 6. Verify the .so file was created
          echo "--- Finding generated .so files ---"
          find . -name "*.so" -type f

      - name: Upload Cactus Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cactus-android-lib
          # Catch the .so file and the Kotlin files
          path: |
            cactus/**/*.so
            cactus/**/Cactus.kt
            cactus/**/CactusCallbacks.kt
# CMake build update
