name: Build Cactus Engine
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Clone, Checkout v2.0.1, and Build Cactus
        run: |
          # 1. Clone and checkout the working version
          git clone https://github.com/cactus-compute/cactus.git
          cd cactus
          git checkout v2.0.1
          
          # 2. Setup environment
          source ./setup
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125

          # 3. Find the CLI executable (ignoring the .git folder)
          CLI=$(find . -path ./.git -prune -o -type f -name "cactus" -print | head -n 1)
          echo "Cactus CLI found at: $CLI"
          if [ -z "$CLI" ]; then
            echo "Cactus CLI not found in the repository!"
            exit 1
          fi
          chmod +x "$CLI"

          # 4. Run the build command directly
          echo "--- Building Cactus for Android ---"
          "$CLI" build --android

          # 5. Verify the output files exist
          echo "--- Finding generated .so and Kotlin files ---"
          find . -name "libcactus*" -type f
          find . -name "Cactus*.kt" -type f

      - name: Upload Cactus Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cactus-android-lib
          # Uploads the compiled engine AND the Kotlin wrapper files
          path: |
            cactus/android/libcactus_engine.so
            cactus/**/Cactus.kt
            cactus/**/CactusCallbacks.kt
